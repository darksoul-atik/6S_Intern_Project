services:
  mongo:
    image: mongo:7.0-jammy
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0-jammy
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo/init-replica-set.js:/scripts/init-replica-set.js:ro
    command:
      [
        "mongosh",
        "--host",
        "mongo:27017",
        "--file",
        "/scripts/init-replica-set.js",
      ]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/devpulse?replicaSet=rs0
      FRONTEND_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mongo_data: