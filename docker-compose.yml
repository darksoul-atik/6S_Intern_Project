services:
  mongo:
    image: mongo:7.0-jammy
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0-jammy
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo/init-replica-set.js:/scripts/init-replica-set.js:ro
    command:
      [
        "mongosh",
        "--host",
        "mongo:27017",
        "--file",
        "/scripts/init-replica-set.js",
      ]
    restart: "no"

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--requirepass",
        "${REDIS_PASSWORD:-devpulse_redis_secret}",
      ]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-devpulse_redis_secret}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      # Local containerized MongoDB replica set (commented out):
      # MONGODB_URI: mongodb://mongo:27017/devpulse?replicaSet=rs0
      # MongoDB Atlas Cloud Database (contains original posts, comments, replies & users):
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://6s_Intern_Project:KlCLxxKjmQB90qcl@darksoul.5bywpqf.mongodb.net/dev_community?appName=DarkSoul}
      FRONTEND_ORIGINS: http://localhost:3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpulse_redis_secret}
    volumes:
      - ./backend/secrets:/app/secrets:ro
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      # Local containerized MongoDB replica set (commented out):
      # MONGODB_URI: mongodb://mongo:27017/devpulse?replicaSet=rs0
      # MongoDB Atlas Cloud Database (contains original posts, comments, replies & users):
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://6s_Intern_Project:KlCLxxKjmQB90qcl@darksoul.5bywpqf.mongodb.net/dev_community?appName=DarkSoul}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpulse_redis_secret}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data: