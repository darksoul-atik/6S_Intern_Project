services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo/init-replica-set.js:/scripts/init-replica-set.js:ro
    command: >
      bash -c "
        mongosh --host mongo:27017 /scripts/init-replica-set.js &&
        until mongosh --host mongo:27017 --quiet --eval
        'quit(db.hello().isWritablePrimary ? 0 : 1)';
        do
          echo 'Waiting for MongoDB replica-set primary...';
          sleep 1;
        done;
        echo 'MongoDB replica set is ready.'
      "
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/devpulse?replicaSet=rs0
      FRONTEND_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mongo_data: